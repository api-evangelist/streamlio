name: Streamlio
description: Streamlio was a real-time streaming and messaging company built around Apache Pulsar, Apache
  Heron, and Apache BookKeeper, surfaced as a portfolio company of lightspeed-venture-partners. The company
  was acquired by Splunk in October 2019 and is no longer operating independently; its former domains
  (streamlio.com, streaml.io) now resolve only to a MarkMonitor brand-protection parking IP that serves no
  content, its GitHub organization returns 404, and it exposes no first-party API surface. Its technology
  lives on as the Apache Pulsar, Heron, and BookKeeper open-source projects rather than as a Streamlio API.
